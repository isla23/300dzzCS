{% extends "base.html" %}

{% block styles %}
  {{ super() }}
  <link rel="stylesheet" href="{{ base_url }}/assets/waline/waline.css" />
  <style>
    /* ===== 评论区统一样式 ===== */
    .wl-embed {
      margin: 1.5rem 0;
      padding: 1rem 1.25rem;
      border: 1px solid var(--md-default-fg-color--lightest, rgba(0,0,0,.12));
      border-radius: 10px;
      background: var(--md-default-bg-color);
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .wl-title {
      margin-bottom: .75rem;
      font-weight: 600;
      color: var(--md-primary-fg-color);
    }
    .wl-fallback {
      padding: .75rem 1rem;
      color: var(--md-default-fg-color--light);
      font-size: .9rem;
    }
  </style>
{% endblock %}

{% block content %}
  {{ super() }}

  {# 文末全局评论区：仅当文章 frontmatter 写了 comments: true 时出现 #}
  {% if page.meta.comments %}
  <div class="wl-embed" data-comment="page-end" data-title="📝 文章评论"></div>
  {% endif %}

  {# Waline 评论脚本 — 用动态 import() 加载 ESM 构建，拿到 init 导出直接初始化 #}
  <script type="module">
    (function () {
      console.log('[Waline] module script 已执行');
      var cfg = {{ config.extra.waline | tojson }};
      if (!cfg || !cfg.serverURL || cfg.serverURL.indexOf('REPLACE') === 0) {
        document.querySelectorAll('.wl-embed').forEach(function (el) {
          el.innerHTML = '<div class="wl-fallback">评论系统未配置：请在 mkdocs.yml 的 extra.waline.serverURL 填入你的 Waline 后端地址。</div>';
        });
        console.warn('[Waline] 未配置 serverURL');
        return;
      }

      function initAll(mod) {
        console.log('[Waline] waline.js 加载成功, init 可用 =', !!(mod.init || (mod.default && mod.default.init)));
        // ESM 构建导出 init；兼容 default.init 形态
        var WalineInit = mod.init || (mod.default && mod.default.init) || mod;
        document.querySelectorAll('.wl-embed').forEach(function (el) {
          if (el.dataset.wlReady) return;
          el.dataset.wlReady = '1';

          var title = el.getAttribute('data-title');
          if (title && (!el.previousElementSibling || !el.previousElementSibling.classList.contains('wl-title'))) {
            var h = document.createElement('div');
            h.className = 'wl-title';
            h.textContent = title;
            el.parentNode.insertBefore(h, el);
          }

          var cid = el.getAttribute('data-comment') || 'page-end';
          var opt = {
            serverURL: cfg.serverURL,
            el: el,
            lang: 'zh-CN',
            login: 'disable',        // 关闭登录按钮，允许匿名
            meta: ['nick'],          // 只保留昵称一栏，邮箱/网址直接砍掉
            pageview: !!cfg.pageview,
            commentSorting: 'latest',
            reaction: !!cfg.reaction
          };
          // 文末主线程沿用旧路径，内联线程追加锚点以隔离
          if (cid !== 'page-end') opt.path = location.pathname + '#' + cid;
          WalineInit(opt);
          console.log('[Waline] 已在', cid, '初始化评论框');
        });
      }

      import('{{ base_url }}/assets/waline/waline.js')
        .then(initAll)
        .catch(function (e) {
          console.error('[Waline] waline.js 加载失败', e);
          document.querySelectorAll('.wl-embed').forEach(function (el) {
            if (!el.dataset.wlReady) el.innerHTML = '<div class="wl-fallback">评论组件加载失败，请检查网络后刷新～</div>';
          });
        });
    })();
  </script>
{% endblock %}
