{% extends "base.html" %}

{% block styles %}
  {{ super() }}
  <link rel="stylesheet" href="{{ 'assets/waline/waline.css' | url }}" />
  <style>
    /* ===== 评论区统一样式 ===== */
    .wl-embed {
      margin: .8rem 0;
      padding: .6rem .9rem;
      border: 1px solid var(--md-default-fg-color--lightest, rgba(0,0,0,.12));
      border-radius: 10px;
      background: var(--md-default-bg-color);
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .wl-title {
      margin-bottom: .4rem;
      font-weight: 600;
      color: var(--md-primary-fg-color);
      font-size: .95rem;
    }
    .wl-fallback {
      padding: .5rem .75rem;
      color: var(--md-default-fg-color--light);
      font-size: .85rem;
    }
    /* 折叠按钮 */
    .wl-collapse-btn {
      display: inline-block;
      margin: .1rem 0 .35rem;
      padding: .18rem .6rem;
      font-size: .76rem;
      line-height: 1.3;
      color: var(--md-primary-fg-color, #ff5722);
      background: transparent;
      border: 1px solid var(--md-default-fg-color--lightest, rgba(0,0,0,.2));
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }
    .wl-collapse-btn:hover { opacity: .7; }
    /* 默认折叠留言列表：状态挂在父级 class，Waline 重渲染也不丢，每个框独立 */
    .wl-embed.wl-collapsed .wl-comments { display: none !important; }
    /* 评论输入框高度降低一半（默认约 88px -> 44px） */
    .wl-embed .wl-input,
    .wl-embed .wl-editor {
      min-height: 44px !important;
    }
    /* 压缩 Waline 默认留白 */
    .wl-embed .wl-panel { padding: 0 !important; }
    .wl-embed .wl-header { margin-bottom: .35rem !important; }
    .wl-embed .wl-header .wl-count { font-size: .8rem; }
    .wl-embed .wl-comments { margin-top: .25rem !important; }
    .wl-embed .wl-card { padding: .35rem 0 !important; }
    .wl-embed .wl-card .wl-content { margin-top: .15rem !important; }
    .wl-embed .wl-comment { padding: .25rem 0 !important; }
    .wl-embed .wl-reply { padding-left: .55rem !important; margin-top: .15rem !important; }
    .wl-embed .wl-input-wrapper { padding: .15rem !important; }
    .wl-embed .wl-input { padding: .25rem .5rem !important; }
  </style>
{% endblock %}

{% block content %}
  {{ super() }}

  {# 文末全局评论区：仅当文章 frontmatter 写了 comments: true 时出现 #}
  {% if page.meta.comments %}
  <div class="wl-embed" data-comment="page-end" data-title="📝 文章评论"></div>
  {% endif %}

  {# Waline 评论脚本 — 用动态 import() 加载 ESM 构建，拿到 init 导出直接初始化 #}
  <script type="module">
    (function () {
      console.log('[Waline] module script 已执行');
      var cfg = {{ config.extra.waline | tojson }};
      if (!cfg || !cfg.serverURL || cfg.serverURL.indexOf('REPLACE') === 0) {
        document.querySelectorAll('.wl-embed').forEach(function (el) {
          el.innerHTML = '<div class="wl-fallback">评论系统未配置：请在 mkdocs.yml 的 extra.waline.serverURL 填入你的 Waline 后端地址。</div>';
        });
        console.warn('[Waline] 未配置 serverURL');
        return;
      }

      function initAll(mod) {
        console.log('[Waline] waline.js 加载成功, init 可用 =', !!(mod.init || (mod.default && mod.default.init)));
        // ESM 构建导出 init；兼容 default.init 形态
        var WalineInit = mod.init || (mod.default && mod.default.init) || mod;
        document.querySelectorAll('.wl-embed').forEach(function (el) {
          if (el.dataset.wlReady) return;
          el.dataset.wlReady = '1';

          var title = el.getAttribute('data-title');
          var titleEl = null;
          if (title && (!el.previousElementSibling || !el.previousElementSibling.classList.contains('wl-title'))) {
            titleEl = document.createElement('div');
            titleEl.className = 'wl-title';
            titleEl.textContent = title;
            el.parentNode.insertBefore(titleEl, el);
          }

          var cid = el.getAttribute('data-comment') || 'page-end';
          var opt = {
            serverURL: cfg.serverURL,
            el: el,
            lang: 'zh-CN',
            login: 'disable',        // 关闭登录按钮，允许匿名
            meta: ['nick'],          // 只保留昵称一栏，邮箱/网址直接砍掉
            pageview: !!cfg.pageview,
            commentSorting: 'latest',
            reaction: !!cfg.reaction
          };
          // 文末主线程沿用旧路径，内联线程追加锚点以隔离
          if (cid !== 'page-end') opt.path = location.pathname + '#' + cid;
          WalineInit(opt);
          console.log('[Waline] 已在', cid, '初始化评论框');

          // 折叠按钮：状态挂到外层 .wl-embed.wl-collapsed，重渲染不丢、各框独立
          var btn = document.createElement('button');
          btn.className = 'wl-collapse-btn';
          btn.type = 'button';
          btn.textContent = '展开评论 ▼';
          el.classList.add('wl-collapsed');   // 初始折叠
          btn.addEventListener('click', function () {
            var collapsed = el.classList.toggle('wl-collapsed');
            btn.textContent = collapsed ? '展开评论 ▼' : '收起评论 ▲';
            if (!collapsed) {
              // 展开时若留言还没加载（被懒加载或异步），强制刷新一次布局
              var comments = el.querySelector('.wl-comments');
              if (comments && !comments.dataset.loaded) {
                comments.dataset.loaded = '1';
              }
            }
          });
          if (titleEl) titleEl.parentNode.insertBefore(btn, titleEl.nextSibling);
          else el.parentNode.insertBefore(btn, el);
        });
      }

      import('{{ 'assets/waline/waline.js' | url }}')
        .then(initAll)
        .catch(function (e) {
          console.error('[Waline] waline.js 加载失败', e);
          document.querySelectorAll('.wl-embed').forEach(function (el) {
            if (!el.dataset.wlReady) el.innerHTML = '<div class="wl-fallback">评论组件加载失败，请检查网络后刷新～</div>';
          });
        });
    })();
  </script>
{% endblock %}
