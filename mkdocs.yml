site_name: 300cs
site_url: https://isla23.github.io/300dzzCS/
site_description: 300cs
repo_url: https://github.com/isla23/300dzzCS
repo_name: 300dzzCS
edit_uri: https://github.com/isla23/300dzzCS/edit/main/


# 自定义CSS
extra_css:
  - stylesheets/extra.css
  - assets/waline/waline.css

extra_javascript:
  - assets/waline/waline.js

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/pic/logo_256.png
  favicon: assets/pic/logo_256.png
  # 主题配色
  palette: 
    # 1. 浅色模式
    - scheme: default
      primary: deep-orange
      accent: deep-orange
      toggle:
        icon: material/weather-sunny
        name: 黄区配色 (Dark Mode)
    # 2. 深色模式
    - scheme: slate
      primary: deep-orange
      accent: deep-orange
      toggle:
        icon: material/weather-night
        name: 白区配色 (Light Mode)
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MaaGF1/MaaGF1
      name: GitHub 仓库
  waline:
    serverURL: "https://300cs-waline-syffkipr6-300cs-projects.vercel.app"
    pageview: true
    reaction: true
# 目录结构
nav:
  - ZC综合cs: tutorial/300cs/zc_cs_1.0.md
  - ZC低分杂蛆cs: tutorial/300cs/zc_k.md
  - JJC: tutorial/300cs/jjc_cs_1.0.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - meta